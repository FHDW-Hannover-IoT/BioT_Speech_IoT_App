plugins {
    alias(libs.plugins.android.application)
    id("org.jetbrains.kotlin.android") version "1.9.22"
    id("com.google.devtools.ksp") version "1.9.22-1.0.17"
}

android {
    namespace = 'com.fhdw.biot.speech.iot'
    compileSdkVersion = 35

    defaultConfig {
        applicationId = "com.fhdw.biot.speech.iot"
        minSdk = 29
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "MQTT_PHONE_BROKER_URL",    '"tcp://192.168.178.32:1883"'
        buildConfigField "String", "MQTT_EMULATOR_BROKER_URL", '"tcp://10.0.2.2:1883"'
        buildConfigField "String", "LLM_HOST_PHONE",           '"192.168.178.32"'
        buildConfigField "String", "LLM_HOST_EMULATOR",        '"10.0.2.2"'
        buildConfigField "int",    "LLM_PORT",                 "8001"
        buildConfigField "int",    "LLM_CONNECT_TIMEOUT_MS",   "15000"
        buildConfigField "int",    "LLM_READ_TIMEOUT_MS",      "60000"
        buildConfigField "int",    "LLM_FETCH_PAGE_SIZE",      "500"
        buildConfigField "int",    "LLM_INITIAL_FETCH_HOURS",  "1"
        buildConfigField "long",    "SIMULATOR_FALLBACK_DELAY_MS", "5000L"
        buildConfigField "long",    "SIMULATOR_INTERVAL_MS",    "500L"

        // Douglas-Peucker epsilon per sensor per resolution tier.
        // Accel in g (gravity-dominated, magnitude ~9.81 g, motion amplitude ~0.02 g).
        // Gyro in deg/s (noise σ ≈ 0.5 deg/s).
        // Magnet in arbitrary units (σ ≈ 1.0 per axis, magnitude ~45).
        buildConfigField "float", "DP_EPSILON_ACCEL_RAW",    "0.01f"
        buildConfigField "float", "DP_EPSILON_ACCEL_1MIN",   "0.02f"
        buildConfigField "float", "DP_EPSILON_ACCEL_1HOUR",  "0.05f"
        buildConfigField "float", "DP_EPSILON_GYRO_RAW",     "0.5f"
        buildConfigField "float", "DP_EPSILON_GYRO_1MIN",    "1.0f"
        buildConfigField "float", "DP_EPSILON_GYRO_1HOUR",   "2.0f"
        buildConfigField "float", "DP_EPSILON_MAGNET_RAW",   "0.5f"
        buildConfigField "float", "DP_EPSILON_MAGNET_1MIN",  "1.0f"
        buildConfigField "float", "DP_EPSILON_MAGNET_1HOUR", "2.0f"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        // Fail the Gradle task if *any* error-level issues are found
        abortOnError =  true

        // Optional: treat warnings as errors (uncomment when you’re ready)
        // warningsAsErrors true

        // Produce multiple report formats for CI artifacts
        htmlReport = true
        xmlReport = true
        sarifReport = true
        textReport = true

        // Show explanations in the text report (nice in CI logs)
        explainIssues = true

        // Analyze dependencies too (useful in multi-module setups)
        checkDependencies = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.room.runtime
    implementation libs.room.ktx
    implementation libs.firebase.firestore
    implementation libs.mockito.core
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation "org.eclipse.paho:org.eclipse.paho.mqttv5.client:1.2.5"
    implementation "org.eclipse.paho:org.eclipse.paho.android.service:1.1.1"
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    annotationProcessor libs.room.compiler
}
